name: CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

env:
  REPO_API: ds-api-gateway
  REPO_CLIENT: ds-client-service
  REPO_ACCOUNT: ds-account-service

jobs:
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build API Gateway JAR
        run: |
          cd ds-api-gateway
          mvn clean package -DskipTests
          cd ..

      - name: Build Client Service JAR
        run: |
          cd ds-client-service
          mvn clean package -DskipTests
          cd ..

      - name: Build Account Service JAR
        run: |
          cd ds-account-service
          mvn clean package -DskipTests
          cd ..

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push API Gateway
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_API }}:latest ./ds-api-gateway
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_API }}:latest

      - name: Build & Push Client Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_CLIENT }}:latest ./ds-client-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_CLIENT }}:latest

      - name: Build & Push Account Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_ACCOUNT }}:latest ./ds-account-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_ACCOUNT }}:latest

  deploy:
    name: Deploy Simulation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Simulate deployment
        run: echo "Simulating deployment of all services"
