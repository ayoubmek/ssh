name: CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

env:
  REPO_API: api-gateway
  REPO_CLIENT: client-service
  REPO_ACCOUNT: account-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: List repo files
        run: ls -R

      - name: Build & Push API Gateway
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_API }}:latest ./api-gateway
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_API }}:latest

      - name: Build & Push Client Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_CLIENT }}:latest ./client-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_CLIENT }}:latest

      - name: Build & Push Account Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_ACCOUNT }}:latest ./account-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_ACCOUNT }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Simulating deployment of all services"
